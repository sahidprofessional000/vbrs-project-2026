  <text x="872" y="410" text-anchor="middle" fill="#475569" font-size="11">Clean SQL Aggregations</text>
  <text x="872" y="428" text-anchor="middle" fill="#475569" font-size="11">Tamper-evident Logs</text>
  <text x="872" y="446" text-anchor="middle" fill="#475569" font-size="11">Technician Verification</text>
