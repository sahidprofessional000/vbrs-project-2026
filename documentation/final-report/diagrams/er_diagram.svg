<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 720" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="20" y="15" width="1010" height="45" rx="6" fill="#0f2b48" />
  <text x="525" y="44" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">VBRS POSTGRESQL RELATIONAL ENTITY RELATIONSHIP DIAGRAM</text>

  <!-- Entity: User -->
  <rect x="30" y="80" width="220" height="210" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <rect x="30" y="80" width="220" height="30" rx="6" fill="#0284c7" />
  <text x="140" y="101" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">User</text>
  <text x="40" y="128" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="40" y="146" fill="#0f172a" font-size="11">email: VARCHAR (UNIQUE)</text>
  <text x="40" y="164" fill="#0f172a" font-size="11">passwordHash: VARCHAR</text>
  <text x="40" y="182" fill="#0f172a" font-size="11">fullName: VARCHAR</text>
  <text x="40" y="200" fill="#0f172a" font-size="11">role: UserRole (ENUM)</text>
  <text x="40" y="218" fill="#0f172a" font-size="11">phone: VARCHAR</text>
  <text x="40" y="236" fill="#0f172a" font-size="11">isVerified: BOOLEAN</text>
  <text x="40" y="254" fill="#0f172a" font-size="11">refreshTokenHash: VARCHAR</text>
  <text x="40" y="272" fill="#0f172a" font-size="11">createdAt: TIMESTAMP</text>

  <!-- Entity: Vehicle -->
  <rect x="30" y="340" width="220" height="170" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <rect x="30" y="340" width="220" height="30" rx="6" fill="#0284c7" />
  <text x="140" y="361" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Vehicle</text>
  <text x="40" y="388" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="40" y="406" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> userId: UUID</text>
  <text x="40" y="424" fill="#0f172a" font-size="11">make: VARCHAR</text>
  <text x="40" y="442" fill="#0f172a" font-size="11">model: VARCHAR</text>
  <text x="40" y="460" fill="#0f172a" font-size="11">year: INTEGER</text>
  <text x="40" y="478" fill="#0f172a" font-size="11">plateNumber: VARCHAR</text>
  <text x="40" y="496" fill="#0f172a" font-size="11">color: VARCHAR</text>

  <!-- Entity: MechanicProfile -->
  <rect x="310" y="80" width="230" height="220" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
  <rect x="310" y="80" width="230" height="30" rx="6" fill="#0d9488" />
  <text x="425" y="101" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">MechanicProfile</text>
  <text x="320" y="128" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="320" y="146" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> userId: UUID (UNIQUE)</text>
  <text x="320" y="164" fill="#0f172a" font-size="11">workshopName: VARCHAR</text>
  <text x="320" y="182" fill="#0f172a" font-size="11">latitude: DOUBLE</text>
  <text x="320" y="200" fill="#0f172a" font-size="11">longitude: DOUBLE</text>
  <text x="320" y="218" fill="#0f172a" font-size="11">isAvailable: BOOLEAN</text>
  <text x="320" y="236" fill="#0f172a" font-size="11">serviceRadiusKm: DOUBLE</text>
  <text x="320" y="254" fill="#0f172a" font-size="11">specialties: TEXT[]</text>
  <text x="320" y="272" fill="#0f172a" font-size="11">averageRating: DOUBLE</text>

  <!-- Entity: BreakdownReport -->
  <rect x="310" y="340" width="230" height="230" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" />
  <rect x="310" y="340" width="230" height="30" rx="6" fill="#d97706" />
  <text x="425" y="361" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">BreakdownReport</text>
  <text x="320" y="388" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="320" y="406" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> customerId: UUID</text>
  <text x="320" y="424" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> vehicleId: UUID</text>
  <text x="320" y="442" fill="#0f172a" font-size="11">latitude: DOUBLE</text>
  <text x="320" y="460" fill="#0f172a" font-size="11">longitude: DOUBLE</text>
  <text x="320" y="478" fill="#0f172a" font-size="11">address: TEXT</text>
  <text x="320" y="496" fill="#0f172a" font-size="11">issueDescription: TEXT</text>
  <text x="320" y="514" fill="#0f172a" font-size="11">subsystem: SubsystemCategory</text>
  <text x="320" y="532" fill="#0f172a" font-size="11">photoUrls: TEXT[]</text>
  <text x="320" y="550" fill="#0f172a" font-size="11">status: IncidentStatus</text>

  <!-- Entity: ServiceRequest & Dispatch -->
  <rect x="580" y="80" width="220" height="230" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
  <rect x="580" y="80" width="220" height="30" rx="6" fill="#dc2626" />
  <text x="690" y="101" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ServiceRequest</text>
  <text x="590" y="128" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="590" y="146" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> breakdownReportId: UUID</text>
  <text x="590" y="164" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> mechanicId: UUID</text>
  <text x="590" y="182" fill="#0f172a" font-size="11">status: ServiceStatus</text>
  <text x="590" y="200" fill="#0f172a" font-size="11">etaMinutes: INTEGER</text>
  <text x="590" y="218" fill="#0f172a" font-size="11">quotedPrice: DECIMAL</text>
  <text x="590" y="236" fill="#0f172a" font-size="11">finalPrice: DECIMAL</text>
  <text x="590" y="254" fill="#0f172a" font-size="11">startedAt: TIMESTAMP</text>
  <text x="590" y="272" fill="#0f172a" font-size="11">completedAt: TIMESTAMP</text>

  <!-- Entity: Review -->
  <rect x="580" y="340" width="220" height="150" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
  <rect x="580" y="340" width="220" height="30" rx="6" fill="#7c3aed" />
  <text x="690" y="361" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Review</text>
  <text x="590" y="388" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="590" y="406" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> serviceRequestId: UUID</text>
  <text x="590" y="424" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> customerId: UUID</text>
  <text x="590" y="442" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> mechanicId: UUID</text>
  <text x="590" y="460" fill="#0f172a" font-size="11">rating: INTEGER (1-5)</text>
  <text x="590" y="478" fill="#0f172a" font-size="11">comment: TEXT</text>

  <!-- Entity: Complaint & Dispute -->
  <rect x="830" y="80" width="190" height="170" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="2" />
  <rect x="830" y="80" width="190" height="30" rx="6" fill="#be123c" />
  <text x="925" y="101" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Complaint</text>
  <text x="840" y="128" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="840" y="146" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> userId: UUID</text>
  <text x="840" y="164" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> serviceRequestId: UUID</text>
  <text x="840" y="182" fill="#0f172a" font-size="11">subject: VARCHAR</text>
  <text x="840" y="200" fill="#0f172a" font-size="11">status: DisputeStatus</text>
  <text x="840" y="218" fill="#0f172a" font-size="11">resolution: TEXT</text>

  <!-- Entity: AuditLog -->
  <rect x="830" y="340" width="190" height="170" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" />
  <rect x="830" y="340" width="190" height="30" rx="6" fill="#475569" />
  <text x="925" y="361" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">AuditLog</text>
  <text x="840" y="388" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#b91c1c">PK</tspan> id: UUID</text>
  <text x="840" y="406" fill="#0f172a" font-size="11"><tspan font-weight="bold" fill="#0284c7">FK</tspan> userId: UUID</text>
  <text x="840" y="424" fill="#0f172a" font-size="11">action: VARCHAR</text>
  <text x="840" y="442" fill="#0f172a" font-size="11">entity: VARCHAR</text>
  <text x="840" y="460" fill="#0f172a" font-size="11">ipAddress: VARCHAR</text>
  <text x="840" y="478" fill="#0f172a" font-size="11">createdAt: TIMESTAMP</text>

  <!-- Connectors with Cardinality -->
  <line x1="140" y1="290" x2="140" y2="340" stroke="#0284c7" stroke-width="2" />
  <text x="148" y="305" fill="#0284c7" font-size="10" font-weight="bold">1</text>
  <text x="148" y="335" fill="#0284c7" font-size="10" font-weight="bold">N</text>

  <line x1="250" y1="160" x2="310" y2="160" stroke="#0d9488" stroke-width="2" />
  <text x="255" y="152" fill="#0d9488" font-size="10" font-weight="bold">1</text>
  <text x="300" y="152" fill="#0d9488" font-size="10" font-weight="bold">1</text>

  <line x1="250" y1="240" x2="310" y2="400" stroke="#d97706" stroke-width="1.5" />
  <text x="255" y="255" fill="#d97706" font-size="10" font-weight="bold">1</text>
  <text x="295" y="405" fill="#d97706" font-size="10" font-weight="bold">N</text>

  <line x1="250" y1="420" x2="310" y2="420" stroke="#d97706" stroke-width="2" />
  <text x="255" y="415" fill="#d97706" font-size="10" font-weight="bold">1</text>
  <text x="300" y="415" fill="#d97706" font-size="10" font-weight="bold">N</text>

  <line x1="540" y1="400" x2="600" y2="310" stroke="#dc2626" stroke-width="2" />
  <text x="545" y="415" fill="#dc2626" font-size="10" font-weight="bold">1</text>
  <text x="585" y="325" fill="#dc2626" font-size="10" font-weight="bold">1</text>

  <line x1="540" y1="180" x2="580" y2="180" stroke="#dc2626" stroke-width="2" />
  <text x="545" y="172" fill="#dc2626" font-size="10" font-weight="bold">1</text>
  <text x="570" y="172" fill="#dc2626" font-size="10" font-weight="bold">N</text>

  <line x1="690" y1="310" x2="690" y2="340" stroke="#7c3aed" stroke-width="2" />
  <text x="698" y="325" fill="#7c3aed" font-size="10" font-weight="bold">1</text>
  <text x="698" y="338" fill="#7c3aed" font-size="10" font-weight="bold">1</text>

  <line x1="800" y1="170" x2="830" y2="170" stroke="#be123c" stroke-width="2" />
  <text x="805" y="162" fill="#be123c" font-size="10" font-weight="bold">1</text>
  <text x="820" y="162" fill="#be123c" font-size="10" font-weight="bold">N</text>

  <path d="M 230,285 C 230,640 850,640 850,510" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="520" y="630" fill="#475569" font-size="10" font-weight="bold">User Activity Auditing (1 : N)</text>
</svg>
