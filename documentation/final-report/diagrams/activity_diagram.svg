<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="20" y="15" width="960" height="45" rx="6" fill="#0f2b48" />
  <text x="500" y="44" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">VBRS END-TO-END BREAKDOWN DISPATCH ACTIVITY DIAGRAM</text>

  <!-- Swimlanes -->
  <rect x="30" y="70" width="300" height="580" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="30" y="70" width="300" height="30" fill="#1e3a8a" />
  <text x="180" y="90" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Customer Swimlane</text>

  <rect x="350" y="70" width="300" height="580" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5" />
  <rect x="350" y="70" width="300" height="30" fill="#701a75" />
  <text x="500" y="90" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">System Gateway &amp; Dispatcher</text>

  <rect x="670" y="70" width="300" height="580" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
  <rect x="670" y="70" width="300" height="30" fill="#991b1b" />
  <text x="820" y="90" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Mechanic Specialist</text>

  <!-- Initial State -->
  <circle cx="180" cy="130" r="14" fill="#0f2b48" />

  <line x1="180" y1="144" x2="180" y2="175" stroke="#0f2b48" stroke-width="2" />
  <polygon points="180,180 176,170 184,170" fill="#0f2b48" />
  <rect x="80" y="180" width="200" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="180" y="205" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Select Vehicle &amp; Pin GPS Location</text>

  <line x1="280" y1="200" x2="390" y2="200" stroke="#0f2b48" stroke-width="2" />
  <polygon points="395,200 385,196 385,204" fill="#0f2b48" />

  <rect x="400" y="180" width="200" height="45" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5" />
  <text x="500" y="200" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Calculate Proximity (Haversine)</text>
  <text x="500" y="216" text-anchor="middle" fill="#475569" font-size="10">Filter: isAvailable &amp;&amp; dist &lt;= radius</text>

  <line x1="500" y1="225" x2="500" y2="255" stroke="#0f2b48" stroke-width="2" />
  <polygon points="500,260 496,250 504,250" fill="#0f2b48" />

  <polygon points="500,260 535,285 500,310 465,285" fill="#ffffff" stroke="#a21caf" stroke-width="1.5" />
  <text x="500" y="289" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="bold">Found?</text>

  <line x1="465" y1="285" x2="410" y2="285" stroke="#dc2626" stroke-width="1.5" />
  <line x1="410" y1="285" x2="410" y2="225" stroke="#dc2626" stroke-width="1.5" />
  <polygon points="410,225 406,233 414,233" fill="#dc2626" />
  <text x="430" y="278" fill="#dc2626" font-size="9" font-weight="bold">No [Queue / Retry]</text>

  <line x1="535" y1="285" x2="720" y2="285" stroke="#0f2b48" stroke-width="2" />
  <polygon points="725,285 715,281 715,289" fill="#0f2b48" />
  <text x="610" y="278" fill="#16a34a" font-size="10" font-weight="bold">Yes [Dispatch Radar]</text>

  <rect x="730" y="265" width="180" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="820" y="289" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Review Breakdown &amp; 3D Model</text>

  <line x1="820" y1="305" x2="820" y2="335" stroke="#0f2b48" stroke-width="2" />
  <polygon points="820,340 816,330 824,330" fill="#0f2b48" />

  <polygon points="820,340 855,365 820,390 785,365" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="820" y="369" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="bold">Accept?</text>

  <line x1="820" y1="390" x2="820" y2="425" stroke="#0f2b48" stroke-width="2" />
  <polygon points="820,430 816,420 824,420" fill="#0f2b48" />
  <text x="828" y="412" fill="#16a34a" font-size="10" font-weight="bold">Yes</text>

  <rect x="730" y="430" width="180" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="820" y="454" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">En Route to Incident Site</text>

  <line x1="730" y1="450" x2="600" y2="450" stroke="#0f2b48" stroke-width="2" />
  <polygon points="595,450 605,446 605,454" fill="#0f2b48" />

  <rect x="400" y="430" width="190" height="40" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5" />
  <text x="495" y="454" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Emit WebSocket ETA Event</text>

  <line x1="400" y1="450" x2="280" y2="450" stroke="#0f2b48" stroke-width="2" />
  <polygon points="275,450 285,446 285,454" fill="#0f2b48" />

  <rect x="80" y="430" width="190" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="175" y="454" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Live Track En-Route Mechanic</text>

  <line x1="820" y1="470" x2="820" y2="505" stroke="#0f2b48" stroke-width="2" />
  <polygon points="820,510 816,500 824,500" fill="#0f2b48" />

  <rect x="730" y="510" width="180" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="820" y="534" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Perform Repair &amp; Mark Completed</text>

  <line x1="730" y1="530" x2="280" y2="530" stroke="#0f2b48" stroke-width="2" />
  <polygon points="275,530 285,526 285,534" fill="#0f2b48" />

  <rect x="80" y="510" width="190" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="175" y="534" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Rate Quality &amp; Confirm Closure</text>

  <line x1="175" y1="550" x2="175" y2="590" stroke="#0f2b48" stroke-width="2" />
  <polygon points="175,595 171,585 179,585" fill="#0f2b48" />

  <circle cx="175" cy="610" r="14" fill="none" stroke="#0f2b48" stroke-width="2" />
  <circle cx="175" cy="610" r="8" fill="#0f2b48" />
</svg>
