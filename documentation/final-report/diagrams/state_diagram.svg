<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="20" y="15" width="960" height="45" rx="6" fill="#0f2b48" />
  <text x="500" y="44" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">VBRS SERVICE REQUEST STATE MACHINE TRANSITION MODEL</text>

  <!-- Start State -->
  <circle cx="70" cy="180" r="14" fill="#0f2b48" />

  <!-- PENDING -->
  <rect x="140" y="150" width="130" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" />
  <text x="205" y="185" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">PENDING</text>
  <line x1="84" y1="180" x2="135" y2="180" stroke="#0f2b48" stroke-width="2" />
  <polygon points="138,180 130,176 130,184" fill="#0f2b48" />
  <text x="112" y="172" text-anchor="middle" fill="#475569" font-size="9">Intake</text>

  <!-- ACCEPTED -->
  <rect x="340" y="150" width="130" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="405" y="185" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">ACCEPTED</text>
  <line x1="270" y1="180" x2="335" y2="180" stroke="#0f2b48" stroke-width="2" />
  <polygon points="338,180 330,176 330,184" fill="#0f2b48" />
  <text x="305" y="172" text-anchor="middle" fill="#475569" font-size="10">Accept Job</text>

  <!-- IN_PROGRESS (En Route & Diagnostic) -->
  <rect x="540" y="150" width="140" height="60" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2" />
  <text x="610" y="185" text-anchor="middle" fill="#6b21a8" font-size="13" font-weight="bold">IN_PROGRESS</text>
  <line x1="470" y1="180" x2="535" y2="180" stroke="#0f2b48" stroke-width="2" />
  <polygon points="538,180 530,176 530,184" fill="#0f2b48" />
  <text x="505" y="172" text-anchor="middle" fill="#475569" font-size="10">Arrive &amp; Repair</text>

  <!-- COMPLETED -->
  <rect x="760" y="150" width="130" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="825" y="185" text-anchor="middle" fill="#15803d" font-size="13" font-weight="bold">COMPLETED</text>
  <line x1="680" y1="180" x2="755" y2="180" stroke="#0f2b48" stroke-width="2" />
  <polygon points="758,180 750,176 750,184" fill="#0f2b48" />
  <text x="720" y="172" text-anchor="middle" fill="#475569" font-size="10">Repair Done</text>

  <!-- Final State -->
  <line x1="890" y1="180" x2="940" y2="180" stroke="#0f2b48" stroke-width="2" />
  <polygon points="945,180 937,176 937,184" fill="#0f2b48" />
  <circle cx="960" cy="180" r="14" fill="none" stroke="#0f2b48" stroke-width="2" />
  <circle cx="960" cy="180" r="8" fill="#0f2b48" />

  <!-- CANCELLED State (Lower) -->
  <rect x="340" y="330" width="130" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="405" y="365" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">CANCELLED</text>

  <!-- Transitions to CANCELLED -->
  <path d="M 205,210 L 205,360 L 335,360" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" />
  <polygon points="338,360 330,356 330,364" fill="#dc2626" />
  <text x="215" y="280" fill="#dc2626" font-size="10">Customer Cancels</text>

  <line x1="405" y1="210" x2="405" y2="325" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" />
  <polygon points="405,328 401,320 409,320" fill="#dc2626" />
  <text x="415" y="270" fill="#dc2626" font-size="10">Timeout / Abort</text>

  <path d="M 470,360 L 960,360 L 960,200" fill="none" stroke="#0f2b48" stroke-width="1.5" />
  <polygon points="960,196 956,204 964,204" fill="#0f2b48" />
  <text x="700" y="352" text-anchor="middle" fill="#475569" font-size="10">Session Closed</text>
</svg>
