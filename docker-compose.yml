services:
  postgres:
    image: postgres:16-alpine
    container_name: vbrs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vbrs_admin
      POSTGRES_PASSWORD: vbrs_secure_password_dev_123
      POSTGRES_DB: vbrs_db
    ports:
      - "5432:5432"
    volumes:
      - vbrs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbrs_admin -d vbrs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vbrs_pgdata:
    driver: local
